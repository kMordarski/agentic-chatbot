name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@4 #cloning repo to VM
      - uses: astral-sh/setup-uv@v6 #installing uv
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -v
